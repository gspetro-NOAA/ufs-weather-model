name: Add PR to Project
on:
  pull_request_target:
    types:
      - opened
      - reopened

jobs:
  add-to-project:
    name: Add pull request to project
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Add PR
        uses: actions/add-to-project@v2.0.0
        with:
          #project-url: https://github.com/orgs/ufs-community/projects/70
          project-url: https://github.com/orgs/NOAA-EPIC/projects/18
          github-token: ${{ secrets.PR_PROJECT_TOKEN }}
      - name: Format PR Opened Date
        id: date
        run: echo "date=$(date -d "${{ github.event.pull_request.created_at }}" +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Add date created
        uses: github/update-project-action@v4
        with:
          github_token: ${{ secrets.PR_PROJECT_TOKEN }}
          #organization: ufs-community
          organization: NOAA-EPIC
          #project_number: 70
          project_number: 18
          operation: update
          content_id: ${{ github.event.pull_request.node_id }}
          field: 'Date Opened'
          value: ${{ steps.date.outputs.date }}
