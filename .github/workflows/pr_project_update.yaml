name: Project Board Updates
on:
  pull_request:
    types:
      - opened
      - reopened
      - labeled
env:
  PR_PROJECT_TOKEN: ${{ secrets.PR_PROJECT_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  add-to-project:
    name: Add pull request to project
    runs-on: ubuntu-latest
    #permissions:
      #contents: read
      #pull-requests: write
      #issues: write
    steps:
      - name: Get pull request number
        run: |
          pr_num=$(curl -H "Authorization: bearer ${{ secrets.PR_PROJECT_TOKEN }}" \
          -H "Content-Type: application/json" \
          -X POST https://api.github.com/graphql \
          -d '{
            "query": "query { repository(owner: \"ufs-community\", name: \"ufs-weather-model\") { pullRequests(headRefName: \"feature/login-ui\", states: OPEN, first: 1) { nodes { number id title url } } } }"
          }')
          echo ${pr_num}
  label-project:
    name: Update project with labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Baseline changes
        if: github.event.label.name == 'Baseline Updates' || github.event.label.name == 'New Baselines'
        uses: nipe0324/update-project-v2-item-field@v2.0.2
        with:
          project-url: https://github.com/orgs/ufs-community/projects/70
          github-token: ${{ secrets.GITHUB_TOKEN }}
          field-name: 'Baseline Changes'
          field-value: 'Yes'
      - name: No baseline changes
        if: github.event.label.name == 'No Baseline Change'
        uses: nipe0324/update-project-v2-item-field@v2.0.2
        with:
          project-url: https://github.com/orgs/ufs-community/projects/70
          github-token: ${{ secrets.GITHUB_TOKEN }}
          field-name: 'Baseline Changes'
          field-value: 'No'
