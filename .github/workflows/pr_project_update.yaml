name: Add PR Project Board
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - labeled
  workflow_call:
    secrets:
      pr_project_token:
        required: true
        description: Token for the github action to add pull requests to the project board

jobs:
  add-to-project:
    name: Add pull request to project
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/ufs-community/projects/70
          github-token: ${{ secrets.pr_project_token }}
