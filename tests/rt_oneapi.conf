COMPILE | s2s_32bit_sfs_debug    | oneapi | -DAPP=S2S -D32BIT=ON -DHYDRO=ON -DCCPP_SUITES=FV3_GFS_v17_coupled_p8_ugwpv1 -DDEBUG=ON  | + ursa | fv3 |
RUN | cpld_debug_sfs                                    | + ursa                              | baseline |

