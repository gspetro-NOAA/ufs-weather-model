# GFS
COMPILE | s2sw_32bit_pdlib       | oneapi | -DAPP=S2SW -D32BIT=ON -DCCPP_SUITES=FV3_GFS_v17_coupled_p8_ugwpv1 -DPDLIB=ON | + ursa | fv3 |
RUN | cpld_control_gfsv17                               | + ursa                              | baseline |

COMPILE | s2sw_32bit_pdlib_debug | oneapi | -DAPP=S2SW -D32BIT=ON -DCCPP_SUITES=FV3_GFS_v17_coupled_p8_ugwpv1 -DPDLIB=ON -DDEBUG=ON | + ursa | fv3 |
RUN | cpld_debug_gfsv17                                 | + ursa                               | baseline |

# SFS
COMPILE | s2s_32bit_sfs          | oneapi | -DAPP=S2S -D32BIT=ON -DHYDRO=ON -DCCPP_SUITES=FV3_GFS_v17_coupled_p8_ugwpv1 | + ursa | fv3 |
